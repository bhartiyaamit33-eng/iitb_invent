version: 1
# AWS Amplify Hosting — Next.js SSR + Prisma
# Requires Node.js 22 (see .nvmrc / package.json engines).

frontend:
  phases:
    preBuild:
      commands:
        - export NODE_VERSION=22
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci
        - npx prisma generate
    build:
      commands:
        - npx prisma migrate deploy
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
