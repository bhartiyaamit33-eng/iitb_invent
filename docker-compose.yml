services:
  postgres:
    image: postgres:16-alpine
    container_name: invent-postgres
    restart: unless-stopped
    ports:
      # Host 5433 avoids clashing with a local Postgres on 5432.
      # Bind localhost only (safe on EC2; still works for local docker).
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: invent
      POSTGRES_PASSWORD: invent
      POSTGRES_DB: invent
    volumes:
      - invent_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invent -d invent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invent_pg_data:
